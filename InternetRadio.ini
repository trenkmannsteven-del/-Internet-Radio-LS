; LOS SANTOS INTERNET RADIO LS v1.0.0 - NEXUS RELEASE
; ------------------------------------------------------------
; Main configuration. Personal settings and favorites are stored
; separately in UserSettings.ini so they can survive updates.
;
; UI languages: English / Deutsch / Espanol
; 61 stations / 10 categories / 13 skins / up to 6 favorites
;
; DEFAULT CONTROLS
; Num0          = open / close menu
; Num4 / Num6   = previous / next tab in menu; previous / next station outside menu
; Num8 / Num2   = move selection; YouTube Music previous / next
; Num5          = select / apply / open YouTube Music
; Num- / Num+   = volume down / up (hold for continuous adjustment)
; Num1          = radio power; YouTube Music play / pause
; Num3          = stop / pause
; Space         = add / remove selected station as favorite (max 6)
; Delete        = remove selected favorite
; F8            = reload configuration
;
; NOTE: Internet radio streams are provided by third-party broadcasters
; and can change or go offline independently of this mod.

[General]
AudioProfileVersion=4
Language=EN
Enabled=true
OnlyInVehicle=true
AutoStart=true
AutoSkipUnavailable=true
StreamFailTimeoutMs=9000
ShowMiniUi=true
PersistentMiniUi=false
HideMiniUiWhileMenuOpen=true
MenuOpenSound=true

; SPECTRUM is the only dynamically color-shifting skin.
SpectrumSkinStrength=0.72

; Slow motion while the custom radio menu is open.
MenuSlowMotion=true
MenuTimeScale=0.45

MiniUiLeft=0.73
MiniUiTop=0.64
MiniUiWidth=0.235
MiniUiHeight=0.122

Volume=49
PlayerMaxVolume=20
VolumeCurveExponent=1.1
YouTubeMaxVolume=55
YouTubeVolumeCurveExponent=1.55
VolumeStep=2
StartStation=1
UiTitle=INTERNET RADIO LS
Skin=SAKURA ZEN

; YouTube Music is user-controlled. Open YT MUSIC and press Num5,
; choose a track in the browser, then start playback.
SpeechDucking=true
PhoneCallDucking=true
MenuDucking=true
MetadataEnabled=true
DuckVolumePercent=40
DuckReleaseMs=1800
DuckAttackMs=350
DuckFadeOutMs=900
DuckingProfileVersion=2

[Controls]
MenuKey=NumPad0
MenuUpKey=NumPad8
MenuDownKey=NumPad2
SelectKey=NumPad5
PreviousStationKey=NumPad4
NextStationKey=NumPad6
VolumeDownKey=Subtract
VolumeUpKey=Add
ToggleKey=NumPad1
StopKey=NumPad3
ReloadConfigKey=F8

