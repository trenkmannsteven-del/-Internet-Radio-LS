name: Sync public release source

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  sync-source:
    if: startsWith(github.event.release.tag_name, 'v1.0.2')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download release ZIP
        run: |
          mkdir -p /tmp/irls-release
          gh release download "${{ github.event.release.tag_name }}" --pattern "*.zip" --dir /tmp/irls-release
          ZIP_FILE="$(find /tmp/irls-release -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          test -n "$ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract tested package
        run: |
          rm -rf /tmp/irls-extracted
          mkdir -p /tmp/irls-extracted
          unzip -q "$ZIP_FILE" -d /tmp/irls-extracted
          test -d /tmp/irls-extracted/scripts
          test -f /tmp/irls-extracted/scripts/03_InternetRadioSimple.3.cs
          test -f /tmp/irls-extracted/README.md
          test -f /tmp/irls-extracted/CHANGELOG.md
          test -f /tmp/irls-extracted/BENUTZERHANDBUCH_DE.md
          test -f /tmp/irls-extracted/USER_MANUAL_EN.md

      - name: Sync v1.0.2 beta source and manuals
        run: |
          rm -rf scripts
          cp -a /tmp/irls-extracted/scripts ./scripts

          for f in \
            README.md \
            CHANGELOG.md \
            BENUTZERHANDBUCH_DE.md \
            USER_MANUAL_EN.md \
            RELEASE_NOTES_v1.0.2_BETA_TEST.txt \
            README_BETA_TEST.txt; do
            if [ -f "/tmp/irls-extracted/$f" ]; then
              cp -f "/tmp/irls-extracted/$f" "./$f"
            fi
          done

      - name: Commit synchronized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source already synchronized."
          else
            git commit -m "Sync source from ${{ github.event.release.tag_name }} release package"
            git push origin HEAD:main
          fi
