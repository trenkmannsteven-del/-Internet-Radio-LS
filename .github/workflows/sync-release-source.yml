name: Sync public release source

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  sync-source:
    if: startsWith(github.event.release.tag_name, 'v1.0.2')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download release ZIP
        run: |
          rm -rf /tmp/irls-release /tmp/irls-extracted
          mkdir -p /tmp/irls-release /tmp/irls-extracted
          gh release download "$RELEASE_TAG" --pattern "*.zip" --dir /tmp/irls-release
          ZIP_FILE="$(find /tmp/irls-release -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          test -n "$ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Validate and extract package
        run: |
          unzip -q "$ZIP_FILE" -d /tmp/irls-extracted
          test -d /tmp/irls-extracted/scripts
          test -f /tmp/irls-extracted/scripts/03_InternetRadioSimple.3.cs
          test -d /tmp/irls-extracted/scripts/InternetRadio

      - name: Sync tested scripts
        run: |
          rm -rf scripts
          cp -a /tmp/irls-extracted/scripts ./scripts

      - name: Commit synchronized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts
          if git diff --cached --quiet; then
            echo "Source already synchronized."
          else
            git commit -m "Sync scripts from $RELEASE_TAG release package"
            git push origin HEAD:main
          fi
