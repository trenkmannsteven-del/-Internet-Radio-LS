; LOS SANTOS INTERNET RADIO LS v1.0.2 - BETA TEST (v7.41 tested base)
; v7.41 plate-light logic: strict daylight OFF gate + driver headlight-intent latch; night follows real low/high beams.
; v7.38 UI: right-side cards widened/re-aligned; media controls no longer collide with the bottom audio-reduction status.
; ------------------------------------------------------------
; Main configuration. Personal settings and favorites are stored
; separately in UserSettings.ini so they can survive updates.
;
; UI languages: English / Deutsch / Espanol / Francais / Italiano / Portugues (BR) / Turkce
; 61 stations / 10 categories / 13 skins / up to 6 favorites
;
; DEFAULT CONTROLS
; Num0          = open / close menu
; Num4 / Num6   = previous / next tab in menu; previous / next station outside menu
; Num8 / Num2   = move selection; YouTube Music / Spotify previous / next
; Num5          = select / apply / open YouTube Music / Spotify
; Num- / Num+   = volume down / up (hold for continuous adjustment)
; Num1          = radio power; YouTube Music / Spotify play / pause
; Num3          = stop / pause
; NumPad7       = manual hazard lights on / off (always available, independent of AutomaticIndicators)
; NumPad9       = manual high beam on / off
; Space         = add / remove selected station as favorite (max 6)
; Delete        = remove selected favorite
; F8            = reload configuration
;
; NOTE: Internet radio streams are provided by third-party broadcasters
; and can change or go offline independently of this mod.

[General]
AudioProfileVersion=4
Language=EN
Enabled=true
OnlyInVehicle=true
AutoStart=true
AutoSkipUnavailable=true
StreamFailTimeoutMs=9000
ShowMiniUi=true
PersistentMiniUi=false
HideMiniUiWhileMenuOpen=true
MenuOpenSound=true

; SPECTRUM is the only dynamically color-shifting skin.
SpectrumSkinStrength=0.72

; Slow motion while the custom radio menu is open.
MenuSlowMotion=true
MenuTimeScale=0.45

MiniUiLeft=0.73
MiniUiTop=0.64
MiniUiWidth=0.235
MiniUiHeight=0.122

Volume=55
PlayerMaxVolume=70
VolumeCurveExponent=1.10
YouTubeMaxVolume=55
YouTubeVolumeCurveExponent=1.55
SpotifyMaxVolume=55
SpotifyVolumeCurveExponent=1.55
VolumeStep=1
StartStation=1
UiTitle=INTERNET RADIO LS
Skin=SPECTRUM

; YouTube Music and Spotify are user-controlled. Open the matching tab and press Num5,
; choose a track in the app/browser, then start playback.
SpeechDucking=true
PhoneCallDucking=true
MenuDucking=true
MetadataEnabled=true
DuckVolumePercent=70
DuckReleaseMs=1800
DuckAttackMs=350
DuckFadeOutMs=900
DuckingProfileVersion=2

[Cars]
; Vehicle-specific effects and custom road-vehicle HUD.
; Most display/effect options below are also available in the in-game CAR menu.
; AutomaticIndicators can be toggled there as well; NumPad7 hazards remain manual regardless.
AudioReactiveNeon=true
NeonBeatSensitivity=6
NeonVoiceFilter=70
NeonPulseStrength=85
NeonPulseSpeed=60
AudioReactiveInteriorLight=true
InteriorLightStrength=70
; Rear plate light. Uses static neon colour when neon is active; otherwise follows the stock/xenon headlight colour.
; It deliberately does NOT pulse or change with Beat Neon.
; v7.41: daytime DRL/automatic-light reports cannot switch the plate lamp on. A real headlight-button action can; at night it follows low/high beams with debounce.
PlateLightEnabled=true

; Turbo Blow-off v7.37: simple ON/OFF switch using the former SPORT BOV timing.
; ON adds ONE stronger blow-off on a real upshift or a clear throttle lift after sustained boost.
; No sustained/high-speed/airborne pulses and no repeated braking spam. High speed/air do not disable BOV detection.
; No external sound files and no engine-power/handling changes.
; true=ON, false=OFF. Detects both installed turbo mod (slot 18) and supported factory turbos.
TurboImpactEnabled=true
; Optional ADD-ON factory-turbo support: add spawn/model names separated by commas or spaces.
; Example: FactoryTurboModels=rs6c8,992turbo,m3g80
; Built-in GTA factory-turbo models are already included and do not need to be listed here.
FactoryTurboModels=

; Class-specific vehicle instruments. Cycles and trains intentionally keep no custom HUD.
; Road HUD: passenger cars, trucks/vans and motorcycles.
ShowCustomSpeedometer=true
; Marine HUD: boats. Flight HUD: helicopters and planes.
ShowBoatHud=true
ShowFlightHud=true
; Uses GTA V built-in manufacturer logos from MPCarHUD (fallback: neutral vehicle icon)
SpeedometerShowCarIcon=true
; RPM strip is road-HUD only.
SpeedometerShowRpm=true
; Road speed: KMH or MPH.
SpeedometerUnit=KMH
; Sea/air: STANDARD = KTS + FT + FT/MIN, METRIC = KM/H + M + M/S.
NavigationUnits=STANDARD

; v7.29 automatic indicators: light steering corrections no longer trigger a signal.
; v7.31 number-plate light: static neon RGB when neon is active; otherwise follows the vehicle headlight/xenon colour.
; v7.37 turbo blow-off: ON/OFF only; one SPORT-style BOV on upshift or hard lift after boost, with anti-spam cooldown. Factory/stock turbos remain supported; add-on spawn names can be listed in FactoryTurboModels.
; The plate light is independent of Beat Neon and can be toggled under CAR > LIGHTING.
; Activation requires sustained strong steering plus a meaningful physical wheel angle.
; Lane changes stay signalled through counter-steer; turns cancel after steering recentres.
; Hazards stay manual on NumPad7.
AutomaticIndicators=true
AutomaticEmergencyHazards=false
; Shared position/size/opacity for all three vehicle HUDs. Normalized screen coordinates.
SpeedometerLeft=0.760
SpeedometerTop=0.826
SpeedometerWidth=0.205
SpeedometerHeight=0.126
SpeedometerOpacity=92

